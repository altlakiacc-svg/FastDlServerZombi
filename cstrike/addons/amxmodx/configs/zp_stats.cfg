// Минимальное время игры на сервере
// для отображения в топе
// (указывать в секундах)
zp_stats_min_time 7200

// Файл с наcтройками зомби классов
zp_stats_zombie_class_file "zm_class.ini"

// Интервал обновления информации о игроках
// (указывать в секундах)
