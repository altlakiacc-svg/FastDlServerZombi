|------БАНК-----|
=================
// Банк ( сохранение денег после дисконекта)
// 1 - Включен
// 0 - Отключен
zp_stats_bank_enable 1

// Тип сохраняемой еденицы
// 1 - Деньги
// 0 - Аммо
