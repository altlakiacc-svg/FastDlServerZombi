=================
|--ЧАТ КОМАНДЫ--|
=================
// Команда /me
// 1 - Включена
// 0 - Отключена
zp_stats_me 1

// Доступна ли команда /me живому игроку
// 1 - Да
// 0 - Нет
zp_stats_me_alive 0

// Команда /rank <[name|ip]>
// 1 - Включена
// 0 - Отключена
zp_stats_rank 1

// Команда /top
// 1 - Включена
// 0 - Отключена
zp_stats_top 1

// Команда /hp
// 1 - Включена
// 0 - Отключена
zp_stats_hp 1

// Команда /stats
// 1 - Включена
// 0 - Отключена
zp_stats_stats 1


